<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoldBot ROS 2 — 真机部署进展</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #0f1420; color: #e8ecf4; padding: 24px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #8b94a7; font-size: 13px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: #1a2133; border-radius: 12px; padding: 18px; }
  .card h2 { font-size: 15px; margin-bottom: 12px; color: #9fb4ff; }
  .ms { display: flex; align-items: center; gap: 10px; padding: 8px 0;
        border-bottom: 1px solid #2a3350; font-size: 14px; }
  .ms:last-child { border-bottom: none; }
  .badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
  .done { background: #1d4d2e; color: #7dffa8; }
  .doing { background: #4d3a1d; color: #ffcf7d; }
  .pending { background: #2a3350; color: #8b94a7; }
  .ms .detail { color: #8b94a7; font-size: 12px; margin-top: 2px; }
  .log { font-size: 13px; line-height: 1.7; }
  .log .date { color: #9fb4ff; font-weight: 600; }
  .tests { font-size: 14px; }
  .tests .pass { color: #7dffa8; } .tests .fail { color: #ff7d7d; }
  /* BT tree */
  .btree { display: flex; flex-direction: column; align-items: center; gap: 0; }
  .bnode { background: #24304d; border: 2px solid #3a4a75; border-radius: 10px;
           padding: 10px 18px; font-size: 13px; text-align: center; min-width: 170px; }
  .bnode .nm { font-weight: 700; color: #cfe0ff; }
  .bnode .ds { font-size: 11px; color: #8b94a7; margin-top: 3px; }
  .bnode.stub { border-color: #6b5a2e; }
  .bnode .st { font-size: 10px; margin-top: 4px; display: inline-block;
               padding: 2px 8px; border-radius: 10px; background: #4d3a1d; color: #ffcf7d; }
  .barrow { width: 2px; height: 22px; background: #3a4a75; }
  .broot { background: #1d3a5f; border-color: #4d8dff; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>🤖 FoldBot ROS 2 — 真机部署进展</h1>
<div class="sub">每天自动推进一部分 · 最后更新 <span id="updated"></span> <span id="datasrc"></span></div>
<div class="grid">

    <div id="milestones"></div>
  </div>
  <div class="card">
    <h2>🌳 行为树主干</h2>
    <div class="btree" id="btree"></div>
  </div>
  <div class="card">
    <h2>🧪 测试</h2>
    <div class="tests" id="tests"></div>
  </div>
  <div class="card">
    <h2>📝 每日日志</h2>
    <div class="log" id="log"></div>
  </div>
</div>

{"bt_nodes": [{"desc": "从待洗篮取衣到折叠区 (GraspWithRetry 用 RetryWithLog：3 次重试、attempts_used 诚实计数、重观察钩子)", "name": "PickFromBasket", "status": "done"}, {"desc": "YOLO 感知 (bbox+kind) + 轮廓 yaw + 躯干宽度 + 裤形分析；mock 仍默认，yolo 模式需 image_path + px_per_m 标定", "name": "PerceiveAndPlan", "status": "done"}, {"desc": "板折主流程：四处抓取重试 + 任务抢占 (PreemptibleSubtree) + 抢占后重感知重规划 (ReplanOnPreempt)", "name": "FoldGarment", "status": "done"}, {"desc": "按真实尺寸阈值 (OWNER_BOUNDARIES) 分类堆叠到家庭衣箱；owner margin<10mm 报 AMBIGUOUS", "name": "SortToBin", "status": "done"}], "daily_log": [{"date": "2026-10-05", "done": "M0 完成：建 repo，写了 bt/main_tree.py (py_trees 四节点主干)，perception/mock_perception.py，planning/fold_math.py (fold.js 移植)，msgs/interfaces.py；tests/test_m0.py 3 个测试全过 (10 ticks 跑完主树)。"}, {"date": "2026-10-05", "done": "M2 完成：planning/fold_planner.py 移植 planner.js (classifyOwner 8 组阈值、detectPantsLength、pantsFoldMode tri/bi/none、planFolds 2折、planPantsFolds tri=3/bi=2/none=1)，tests/test_m2.py 4 个测试全过；M0 回归通过。"}, {"date": "2026-10-05", "done": "M3 完成：bt/pick_subtree.py 把 PickFromBasket 拆成 8 个独立节点 (MoveToBasket/DescendToGarment/CloseGripper/LiftSlightly/VerifyGrasp/MoveToFoldZone/ReleaseGarment/RetractArm)，GraspSequence 用 Retry 装饰器做 3 次重试；tests/test_m3.py 4 个测试全过 (结构/重试成功/3次耗尽/全树回归)。修了一个 py_trees memory=False 导致 Sequence 死循环的 bug。"}, {"date": "2026-10-05", "done": "M4 完成：bt/perceive_subtree.py 把 PerceiveAndPlan 拆成 5 节点 (CaptureImage/ClassifyGarment/DetectKeypoints/ClassifyOwner/PlanFolds)，ClassifyOwner 和 PlanFolds 用 M2 的真实 planner 不再 mock；FoldGarment 改读真实 FoldPlan；tests/test_m4.py 4 个测试全过 (T恤3折/爸爸长裤tri/全树端到端)。修 mock_perception 裤子比例使其判为长裤。"}, {"date": "2026-10-05", "done": "M5 完成 (全部里程碑 done)：bt/fold_subtree.py — 每个 FoldStep 展开成 6 个原子动作 (抓/闭爪/按/执行折/松爪/收臂)，FoldStepsIterator 从黑板动态读计划；bt/sort_subtree.py — 5 节点 (抓/移到衣箱/堆叠/松爪/收臂)，黑板维护各衣箱堆叠计数。tests/test_m5.py 4 个测试全过。修 StackInBin 黑板 KeyError (bin_counts 不存在时)。19/19 测试全过。"}, {"date": "2026-10-06", "done": "板折主线 (use_board=True 默认)：BoardFoldSimulator、check_placement()、裤子 tri-fold 经手臂腰抓；YOLOv8n 在 500 合成图上 val mAP50=0.995——但 train/val 同源于 5 件衣服，记为过拟合警告，不可信硬件；perception/yolo_perception.py + perception/eval_real.py。"}, {"date": "2026-10-10", "done": "M6：YOLO 接入 BT (perceive_subtree perception=\"yolo\"，mock 仍默认)；yolo 模式要求 image_path + px_per_m 标定，ABC fold_plan 在 yolo 模式跳过——bbox 没有袖子/a/b/c/裆部关键点，不编造。6 个 wiring 测试全过。"}, {"date": "2026-10-11", "done": "bbox 内 garment_yaw_in_bbox()：边界采样背景 + Otsu + numpy PCA 求长轴（纯 numpy，不用 cv2），yaw ∈ [-90,90) 与 check_placement() 约定一致；分段失败（均匀颜色/过小/近正方形）返回 None→yaw=0。15 个新测试全过。"}, {"date": "2026-10-12", "done": "owner 分类决策：真实尺寸阈值 (OWNER_BOUNDARIES 单一来源)，不训练 owner 类别——只有 5 件真实衣服会记住身份而非泛化；新增 owner_margin()/classify_owner_candidates()，margin<10mm 报 AMBIGUOUS（妈妈 vs 女儿衬衫只差 1cm）。已知局限：yolo 模式 bbox 宽度含袖子，owner 标签暂定。"}, {"date": "2026-10-13", "done": "她拍了 15 张真实板上照片（弟弟6/姐姐6/妈妈3，8 衫 7 裤）；合成权重首评：15/15 检出但 26 框全判 shirt、0 裤子、框过大——合成 0.995 没迁移；fine-tune 后 13/15 top-1 正确、裤子被认出、框收紧 57%、val mAP50=0.912；诚实警告：15 张仍太小，模型记住了她的板和背景，权重/data 永不进公开 repo。board-viz reset() 修复：basePos 也要从 initPos 恢复。"}, {"date": "2026-10-14", "done": "裤子 leg-merging + waist-grab (perception/pants_shape.py，纯 numpy 边缘/轮廓、无关键点)：inseam 缺口分腿→外缘抓取+中线镜像折叠目标；顶带腰缘→抓取端点；看不到缺口时 legs=None，BoardFoldIterator 直接 SKIP 侧折（不折空气）。14 个新测试，全套件 80/80。"}, {"date": "2026-10-14", "done": "板折四个抓取包上 RetryWithLog（3 次，attempts_used 诚实计数、每轮 INFO、放弃 WARNING、可选 on_retry 重观察钩子）；pick_subtree 的 GraspWithRetry 统一用同一装饰器，替代静默的 py_trees Retry。10 个新测试，全套件 117/117。"}, {"date": "2026-10-14", "done": "任务抢占 PreemptibleSubtree：黑板 preempt_request→停折+停臂+记 preempt_reason，返回 FAILURE 不把半折衣服分拣；抢占后 ReplanOnPreempt 重感知+重折（max_replans=1，腿已合并则 legs=None 自动跳侧折）。16 个新测试，全套件 117/117。"}, {"date": "2026-10-14", "done": "contour torso width (garment_torso_width_in_bbox，躯干中段 0.30–0.70 中位行宽，纯 numpy）替代 bbox 宽度做 owner 分类，修复 10-12 袖宽已知局限；ClassifyOwnerNode 优先轮廓测量，fallback 仍在日志里标 provisional。11 个新测试，全套件 117/117。"}], "milestones": [{"date": "2026-10-05", "detail": "py_trees 主树跑通 (pick→perceive→fold→sort)，3 个单测全过", "id": "M0", "status": "done", "title": "接口包 + BT 空主干 + mock 感知"}, {"date": "2026-10-05", "detail": "planning/fold_math.py (fold.js 移植) 已在 M0 完成", "id": "M1", "status": "done", "title": "fold.js 数学移植到 Python"}, {"date": "2026-10-05", "detail": "planning/fold_planner.py 移植完成 (classifyOwner/detectPantsLength/planFolds/planPantsFolds)，4 个测试全过", "id": "M2", "status": "done", "title": "planner.js 移植 (planFolds/planPantsFolds/classifyOwner)"}, {"date": "2026-10-05", "detail": "bt/pick_subtree.py: 8 个独立动作节点 + GraspWithRetry(3次重试)，4 个测试全过", "id": "M3", "status": "done", "title": "PickFromBasket 子树细化"}, {"date": "2026-10-05", "detail": "bt/perceive_subtree.py: 5 节点感知规划链，接入 M2 真实 planner (classifyOwner/planFolds)，4 个测试全过", "id": "M4", "status": "done", "title": "PerceiveAndPlan 子树细化"}, {"date": "2026-10-05", "detail": "bt/fold_subtree.py (每折6个原子动作，动态迭代) + bt/sort_subtree.py (5节点+衣箱堆叠计数)，4 个测试全过", "id": "M5", "status": "done", "title": "FoldStep / SortToBin 子树细化"}, {"date": "2026-10-10", "detail": "perceive_subtree perception=\"yolo\"：DetectKeypoints→yolo_perceive+bbox_to_placement_kp→check_placement；mock 仍默认", "id": "M6", "status": "done", "title": "YOLO 接入 BT"}, {"date": "2026-10-11", "detail": "garment_yaw_in_bbox() 纯 numpy 长轴估计，yaw_deg 传入 bbox_to_placement_kp；15 测试", "id": "M7", "status": "done", "title": "bbox 内轮廓估计 yaw"}, {"date": "2026-10-12", "detail": "owner_margin()+classify_owner_candidates()，ClassifyOwnerNode margin<10mm 报 AMBIGUOUS；决策：阈值而非训练 owner 类别", "id": "M8", "status": "done", "title": "owner 尺寸阈值 + 模糊警告"}, {"date": "2026-10-13", "detail": "15 张真实照片：kind 8/15→13/15，裤子被认出，val mAP50=0.912；小数据警告：模型记住了她的板/背景，权重永不进公开 repo", "id": "M9", "status": "done", "title": "真实照片验证 + fine-tune"}, {"date": "2026-10-14", "detail": "perception/pants_shape.py：inseam 缺口分腿、外缘抓取+中线镜像目标、顶带腰缘端点；legs=None 时 SKIP 侧折；14 测试", "id": "M10", "status": "done", "title": "裤子 leg-merging + waist-grab"}, {"date": "2026-10-14", "detail": "RetryWithLog（诚实计数+日志+on_retry 钩子）：板折四处抓取 + pick_grasp 统一；10 测试", "id": "M11", "status": "done", "title": "抓取重试统一"}, {"date": "2026-10-14", "detail": "PreemptibleSubtree（停折+停臂+记因，FAILURE 不分拣半折衣）+ ReplanOnPreempt（重感知+重折，max 1 次）；16 测试", "id": "M12", "status": "done", "title": "任务抢占 + 重规划"}, {"date": "2026-10-14", "detail": "garment_torso_width_in_bbox() 纯 numpy 躯干宽度替代 bbox 宽度，修复袖宽偏差；11 测试", "id": "M13", "status": "done", "title": "轮廓躯干宽度"}, {"date": null, "detail": "等她拍更多衣服（尤其妈妈的衣服 + 更多裤子），再跑 eval_real + fine-tune", "id": "M14", "status": "pending", "title": "更多真实照片泛化 [NEEDS HER]"}, {"date": null, "detail": "模型仍记板/背景，量化会锁死坏权重——泛化确认后再做", "id": "M15", "status": "pending", "title": "INT8 量化（延期）"}], "tests": {"failed": 0, "last_run": "2026-10-14", "passed": 117}, "updated": "2026-10-14"}

<script>
function render(d) {
  document.getElementById('updated').textContent = d.updated;
  // milestones
  const ms = document.getElementById('milestones');
  d.milestones.forEach(m => {
    const cls = m.status === 'done' ? 'done' : m.status === 'doing' ? 'doing' : 'pending';
    const txt = m.status === 'done' ? '✅ 完成' : m.status === 'doing' ? '🔄 进行中' : '⏳ 待做';
    ms.innerHTML += `<div class="ms"><span class="badge ${cls}">${m.id}</span>
      <div><div>${txt} ${m.title}</div>${m.detail ? `<div class="detail">${m.detail}</div>` : ''}</div></div>`;
  });
  // btree
  const bt = document.getElementById('btree');
  bt.innerHTML = `<div class="bnode broot"><div class="nm">FoldBotMain</div>
    <div class="ds">Sequence · 主树</div></div><div class="barrow"></div>`;
  d.bt_nodes.forEach((n, i) => {
    bt.innerHTML += `<div class="bnode stub"><div class="nm">${n.name}</div>
      <div class="ds">${n.desc}</div><div class="st">${n.status === 'done' ? '✅ 实现' : '🔧 stub'}</div></div>`;
    if (i < d.bt_nodes.length - 1) bt.innerHTML += `<div class="barrow"></div>`;
  });
  // tests
  document.getElementById('tests').innerHTML =
    `上次运行：${d.tests.last_run}<br><span class="pass">✅ 通过 ${d.tests.passed}</span> ·
     <span class="fail">❌ 失败 ${d.tests.failed}</span>`;
  // log
  const log = document.getElementById('log');
  d.daily_log.slice().reverse().forEach(e => {
    log.innerHTML += `<div style="margin-bottom:10px"><span class="date">${e.date}</span><br>${e.done}</div>`;
  });
}
function renderEmbedded() {
  var el = document.getElementById('progress-embedded');
  try {
    render(JSON.parse(el.textContent));
    document.getElementById('datasrc').textContent = '（本地快照 · 双击打开时显示）';
  } catch (e) {
    document.getElementById('milestones').innerHTML = '<div style="color:#ff7d7d">看板数据加载失败</div>';
  }
}
fetch('progress.json').then(function (r) { if (!r.ok) throw new Error('no json'); return r.json(); }).then(render).catch(renderEmbedded);
</script>
