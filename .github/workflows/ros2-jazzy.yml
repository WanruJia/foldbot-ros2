name: ROS 2 Jazzy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    env:
      ROS_DOMAIN_ID: 97
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate deployment
        run: bash deploy/ubuntu24/validate_ros.sh